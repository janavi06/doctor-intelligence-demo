<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article | Doctor Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Ubuntu:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body>
<main class="art" id="art"></main>
<script src="js/app.js"></script><script src="js/articles.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id'),a=ARTICLES[id],m=$('#art');
if(!a){m.innerHTML='<p class="empty">Article not found.</p><p style="text-align:center"><a class="btn" href="index.html">Back to home</a></p>'}
else{document.title=a.title+' | Doctor Intelligence';
m.innerHTML=`<a class="back" href="index.html">← Back to home</a><small class="eye">${esc(a.cat)} · ${esc(a.read)}</small><h1>${esc(a.title)}</h1><img src="${a.img}" alt="${esc(a.title)}">${a.body.map(([h,p])=>`<h2>${esc(h)}</h2><p>${esc(p)}</p>`).join('')}<p class="note">This article is for general information only and is not a substitute for professional medical advice.</p><a class="btn" href="doctors.html">Find a doctor ↗</a>`}
</script></body></html>
